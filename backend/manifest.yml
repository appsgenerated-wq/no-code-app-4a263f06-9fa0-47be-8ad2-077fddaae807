name: FoodApp

entities:
  User:
    authenticable: true
    properties:
      - name
      - name: email
        type: email
      - name: role
        type: choice
        options:
          values: [customer, owner, admin]
        default: customer
    policies:
      create:
        - access: admin
      read:
        - access: restricted
          allow: User
          condition: self
      update:
        - access: restricted
          allow: User
          condition: self
      delete:
        - access: admin
      signup:
        - access: public

  Restaurant:
    properties:
      - name: name
        type: string
      - name: description
        type: text
      - name: address
        type: string
      - name: cuisine
        type: choice
        options:
          values: [Italian, Mexican, Chinese, Indian, American]
      - name: photo
        type: image
        options:
          sizes:
            thumbnail:
              width: 200
              height: 200
            banner:
              width: 800
              height: 400
    belongsTo:
      - name: owner
        entity: User
    policies:
      create:
        - access: restricted
          allow: User
      read:
        - access: public
      update:
        - access: restricted
          allow: User
          condition: self
      delete:
        - access: restricted
          allow: User
          condition: self

  MenuItem:
    properties:
      - name: name
        type: string
      - name: description
        type: text
      - name: price
        type: money
        options:
          currency: 'USD'
      - name: category
        type: choice
        options:
          values: [Appetizer, Main, Dessert, Drink]
      - name: photo
        type: image
        options:
          sizes:
            small:
              width: 100
              height: 100
    belongsTo:
      - name: restaurant
        entity: Restaurant
    policies:
      create:
        - access: restricted
          allow: User
      read:
        - access: public
      update:
        - access: restricted
          allow: User
          # Note: More complex policy would check restaurant ownership
          # For this model, we rely on the frontend to gate this action
      delete:
        - access: restricted
          allow: User

  Order:
    properties:
      - name: status
        type: choice
        options:
          values: [pending, confirmed, delivered, cancelled]
        default: pending
      - name: totalPrice
        type: money
        options:
          currency: 'USD'
    belongsTo:
      - name: customer
        entity: User
    belongsToMany:
      - name: items
        entity: MenuItem
    policies:
      create:
        - access: restricted
          allow: User
      read:
        - access: restricted
          allow: User
          condition: self
      update:
        - access: restricted
          allow: User
          condition: self
      delete:
        - access: admin


# Health check endpoint for connection testing
endpoints:
  health:
    path: /api/health
    method: GET
    policies: []
    handler: healthCheck